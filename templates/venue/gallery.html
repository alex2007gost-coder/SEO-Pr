{% extends "base.html" %}
{% load static seo %}

{% block content %}
<section class="page-head">
  <div class="container">
    <p class="mono muted">Фото</p>
    <h1 class="page-head__title">Фото банкетных залов</h1>
    <p class="page-head__lead">Так выглядят залы без гостей. Фото с мероприятий — в наших соцсетях.</p>
  </div>
</section>

<section class="section section--tight">
  <div class="container gallery">
    {% for photo in photos %}
      <figure class="gallery__item">
        <a href="{% static photo.src %}" class="gallery__link" data-lightbox="{{ photo.caption }}">
          {% picture photo.src photo.alt "(max-width: 700px) 100vw, 600px" forloop.counter|gt:2 %}
        </a>
        <figcaption class="mono">{{ photo.caption }}</figcaption>
      </figure>
    {% endfor %}
  </div>
</section>
{% endblock %}

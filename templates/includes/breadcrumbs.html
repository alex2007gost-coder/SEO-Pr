{% if breadcrumbs %}
  <nav class="container breadcrumbs mono" aria-label="Хлебные крошки">
    {% for crumb in breadcrumbs %}
      {% if crumb.url and not forloop.last %}<a href="{{ crumb.url }}">{{ crumb.name }}</a> <span>/</span>{% else %}<span aria-current="page">{{ crumb.name }}</span>{% endif %}
    {% endfor %}
  </nav>
{% endif %}
